<!doctype html><meta charset="utf-8"><title>send</title><body>sending…<script>
(async()=>{const q=new URLSearchParams(location.search);const files=(q.get('f')||'').split(',').filter(Boolean);const out=[];
for(const f of files){const r=await fetch(f,{cache:'no-store'});out.push({name:f.split('/').pop(),type:r.headers.get('content-type')||'application/octet-stream',buf:await r.arrayBuffer()});}
(window.opener||window.parent).postMessage({kind:'files',files:out},'*');document.body.textContent='sent '+out.length;})();
</script>
